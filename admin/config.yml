backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "preisliste"
    label: "Preisliste"
    files:
      - file: "data/preise.json"
        label: "Produkte & Preise"
        name: "produkte"
        fields:
          - label: "Produkte"
            name: "produkte"
            widget: "list"
            fields:
              - {label: "Kategorie", name: "kategorie", widget: "string"}
              - {label: "Produktname", name: "name", widget: "string"}
              - {label: "Beschreibung", name: "beschreibung", widget: "text"}
              - label: "Preise"
                name: "preise"
                widget: "list"
                fields:
                  - {label: "Menge", name: "menge", widget: "string"}
                  - {label: "Preis", name: "preis", widget: "string"}
